name: SafeNav Build APK

on:
  push:
    branches: [ safenav-ua ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: safenav-ua
          submodules: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;23.1.7779620" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Налаштування Gradle
        run: |
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          android.useAndroidX=true
          EOF

      - name: Gradle dependencies
        run: ./gradlew dependencies --configuration legacyDebugRuntimeClasspath \
               --no-daemon || true

      - name: Збірка APK
        run: |
          ./gradlew :OsmAnd:assembleLegacyDebug \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/23.1.7779620

      - name: Знайти APK
        run: find OsmAnd/build/outputs -name "*.apk" -type f

      - name: Зберегти APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SafeNav-debug-${{ github.run_number }}
          path: OsmAnd/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Зберегти логи помилок
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 7
