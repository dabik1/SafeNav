name: SafeNav Build APK

on:
  push:
    branches: [ safenav-ua ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: safenav-ua

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Android SDK + NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;23.1.7779620" \
            "build-tools;35.0.0" \
            "platforms;android-35" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/23.1.7779620" >> $GITHUB_ENV

      - name: Права + налаштування Gradle
        run: |
          chmod +x gradlew
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

      - name: Збірка APK
        run: |
          ./gradlew :OsmAnd:assembleGplayFullLegacyFatDebug \
            --no-daemon \
            --stacktrace \
            -x test \
            -x lint \
            2>&1 | tee /tmp/gradle-build.log
          exit ${PIPESTATUS[0]}

      - name: Показати помилки
        if: failure()
        run: |
          echo "====== ОСТАННІ 100 РЯДКІВ ======"
          tail -100 /tmp/gradle-build.log

      - name: Зберегти лог
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Зберегти APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNav-debug-${{ github.run_number }}
          path: OsmAnd/build/outputs/apk/**/gplayFullLegacyFat/debug/*.apk
          retention-days: 30
