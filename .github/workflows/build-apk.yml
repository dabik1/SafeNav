name: SafeNav Build APK

on:
  push:
    branches: [ safenav-ua ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: safenav-ua

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Android SDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;23.1.7779620" \
            "build-tools;35.0.0" \
            "platforms;android-35" 2>/dev/null

      - name: Права + налаштування
        run: |
          chmod +x gradlew
          cat >> gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=512m
          org.gradle.daemon=false
          org.gradle.parallel=false
          EOF

      - name: Збірка APK (з логом)
        run: |
          ./gradlew :OsmAnd:assembleLegacyDebug \
            --no-daemon \
            --stacktrace \
            --info \
            -x test \
            -x lint \
            2>&1 | tee /tmp/gradle-build.log
          
          # Виводимо тільки помилки якщо збірка впала
          exit ${PIPESTATUS[0]}

      - name: Показати помилки якщо впало
        if: failure()
        run: |
          echo "====== ERRORS ======"
          grep -E "^(error:|FAILED|> Task|Execution failed|> Could not|Cannot|what went wrong)" \
            /tmp/gradle-build.log | tail -50
          echo "====== LAST 100 LINES ======"
          tail -100 /tmp/gradle-build.log

      - name: Зберегти лог
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log-${{ github.run_number }}
          path: /tmp/gradle-build.log
          retention-days: 7

      - name: Зберегти APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SafeNav-debug-${{ github.run_number }}
          path: OsmAnd/build/outputs/apk/**/*.apk
          retention-days: 30
